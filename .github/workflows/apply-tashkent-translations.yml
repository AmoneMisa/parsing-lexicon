name: Apply Tashkent translation sync

on:
  push:
    branches:
      - data/tashkent-translations-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch canonical Tashkent vocabulary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/uz-location-extensions.js')
          text = source.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one source match, got {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          replace_once(
              "      { name: 'Qalqon', aliases: ['Қалқон','Калкон'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: 'Qalqon', aliases: ['Qalqon mahallasi','Қалқон','Қалқон маҳалласи','Калкон','махалля Калкон'], labels: { en: 'Qalqon', uz: 'Qalqon mahallasi', ru: 'Калкон' }, parent: 'Yashnobod', confidence: 'official' },",
          )
          replace_once(
              "      { name: \"Bog'bon\", aliases: ['Bog‘bon','Bogʻbon','Bogbon','Боғбон','Богбон'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: \"Bog'bon\", aliases: [\"Bog'bon mahallasi\",'Bog‘bon','Bogʻbon','Bogbon','Боғбон','Боғбон маҳалласи','Богбон','махалля Богбон'], labels: { en: \"Bog'bon\", uz: \"Bog'bon mahallasi\", ru: 'Богбон' }, parent: 'Yashnobod', confidence: 'official' },",
          )

          for n, parent in [(1, 'Mirobod'), (2, 'Mirobod'), (3, 'Mirobod'), (4, 'Mirobod'), (5, 'Sergeli'), (6, 'Sergeli'), (7, 'Sergeli')]:
              old = f'''      {{ name: "Qo'yliq-{n}", aliases: ['Qo‘yliq-{n}','Qoʻyliq-{n}','Qoyliq-{n}','Qoyliq {n}','Куйлюк-{n}','Куйлюк {n}','Куйлик-{n}','Куйлик {n}'], parent: '{parent}', confidence: 'official' }},'''
              new = f'''      {{ name: "Qo'yliq-{n}", aliases: ['Qo‘yliq-{n}','Qoʻyliq-{n}','Qoyliq-{n}','Qoyliq {n}','Qo‘yliq-{n} mavzesi','Қўйлиқ-{n}','Қўйлиқ {n}','Қўйлиқ-{n} мавзеси','Куйлюк-{n}','Куйлюк {n}','Куйлик-{n}','Куйлик {n}'], labels: {{ en: "Qo'yliq-{n}", uz: 'Qo‘yliq-{n} mavzesi', ru: 'Куйлюк-{n}' }}, parent: '{parent}', confidence: 'official' }},'''
              replace_once(old, new)

          replace_once(
              "      { name: 'Parkent-Riyoziy', aliases: ['Parkent Riyoziy','Riyoziy','Mavlono Riyoziy','Мавлоно Риёзи','Риёзий','Риезий','Паркент Риёзий'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: 'Parkent-Riyoziy', aliases: ['Parkent Riyoziy','Parkent-Riyoziy mavzesi','Riyoziy','Mavlono Riyoziy','Мавлоно Риёзи','Риёзий','Риезий','Паркент Риёзий','Паркент-Риёзий','Паркент-Риёзий массив','Паркент-Риёзий мавзеси'], labels: { en: 'Parkent-Riyoziy', uz: 'Parkent-Riyoziy mavzesi', ru: 'Паркент-Риёзий' }, parent: 'Yashnobod', confidence: 'official' },",
          )
          replace_once(
              "      { name: 'Parkent-Siolkovskiy', aliases: ['Parkent Siolkovskiy','Parkent Tsiolkovskiy','Сиолковский массив','Циолковский массив','Паркент Сиолковский'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: 'Parkent-Siolkovskiy', aliases: ['Parkent Siolkovskiy','Parkent Tsiolkovskiy','Parkent-Siolkovskiy mavzesi','Parkent-Tsiolkovskiy','Siolkovskiy','Tsiolkovskiy','Сиолковский','Сиолковский массив','Циолковский массив','Паркент Сиолковский','Паркент-Сиолковский','Паркент-Сиолковский массив','Паркент-Сиолковский мавзеси'], labels: { en: 'Parkent-Siolkovskiy', uz: 'Parkent-Siolkovskiy mavzesi', ru: 'Паркент-Сиолковский' }, parent: 'Yashnobod', confidence: 'official' },",
          )
          replace_once(
              "      { name: 'Qalqon', aliases: ['Qalqon mavzesi','Қалқон мавзе','Калкон массив','Harbiylar-58a','Harbiylar 58a','Harbiylar-58a shaharchasi'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: 'Qalqon', aliases: ['Qalqon mavzesi','Қалқон мавзе','Қалқон мавзеси','Калкон массив','Harbiylar-58a','Harbiylar 58a','Harbiylar-58a shaharchasi','Ҳарбийлар-58а','Ҳарбийлар-58а шаҳарчаси','Харбийлар-58а'], labels: { en: 'Qalqon', uz: 'Qalqon mavzesi', ru: 'массив Калкон' }, parent: 'Yashnobod', confidence: 'official' },",
          )
          replace_once(
              "      { name: \"Bog'bon\", aliases: ['Bog‘bon mavzesi','Bogʻbon mavzesi','Bogbon mavzesi','Боғбон мавзе','Богбон массив','Normuhammedov mavzesi','Normuhammedov','Нормухаммедов'], parent: 'Yashnobod', confidence: 'official' },",
              "      { name: \"Bog'bon\", aliases: ['Bog‘bon mavzesi','Bogʻbon mavzesi','Bogbon mavzesi','Боғбон мавзе','Боғбон мавзеси','Богбон массив','Normuhammedov mavzesi','Normuhammedov','Нормуҳаммедов','Нормуҳаммедов мавзеси','Нормухаммедов','Нормухаммедов массив'], labels: { en: \"Bog'bon\", uz: \"Bog'bon mavzesi\", ru: 'массив Богбон' }, parent: 'Yashnobod', confidence: 'official' },",
          )
          replace_once(
              "      { name: 'Guruchariq', aliases: ['Guruchariq mavzesi','Guruch ariq','Гуручариқ','Гуручарик','S-22','S 22','С-22','С 22','C-22','C 22'], parent: 'Almazar', confidence: 'official' },",
              "      { name: 'Guruchariq', aliases: ['Guruchariq mavzesi','Guruch ariq','Гуручариқ','Гуручариқ мавзеси','Гуручарик','массив Гуручарик','S-22','S 22','С-22','С 22','C-22','C 22','Markaz-22','Markaz 22','Марказ-22','Марказ 22'], labels: { en: 'Guruchariq', uz: 'Guruchariq mavzesi', ru: 'массив Гуручарик' }, parent: 'Almazar', confidence: 'official' },",
          )
          replace_once(
              "      { name: 'Beruniy-B1', aliases: ['Beruniy B1','Beruniy B-1','Беруний-Б1','Беруний Б1'], parent: 'Almazar', confidence: 'official' },",
              "      { name: 'Beruniy-B1', aliases: ['Beruniy B1','Beruniy B-1','Beruniy-B1 mavzesi','Beruniy B1 mavzesi','Беруний-Б1','Беруний Б1','Беруний-Б1 мавзе','Беруний-Б1 массив'], labels: { en: 'Beruniy-B1', uz: 'Beruniy-B1 mavzesi', ru: 'Беруний-Б1' }, parent: 'Almazar', confidence: 'official' },",
          )
          replace_once(
              "      { name: 'Beruniy-B3', aliases: ['Beruniy B3','Beruniy B-3','Беруний-Б3','Беруний Б3'], parent: 'Almazar', confidence: 'official' },",
              "      { name: 'Beruniy-B3', aliases: ['Beruniy B3','Beruniy B-3','Beruniy-B3 mavzesi','Beruniy B3 mavzesi','Беруний-Б3','Беруний Б3','Беруний-Б3 мавзе','Беруний-Б3 массив'], labels: { en: 'Beruniy-B3', uz: 'Beruniy-B3 mavzesi', ru: 'Беруний-Б3' }, parent: 'Almazar', confidence: 'official' },",
          )

          source.write_text(text, encoding='utf-8')

          display_test = Path('test/geography-display.test.js')
          display = display_test.read_text(encoding='utf-8')
          marker = "test('Tashkent multilingual locality labels stay deterministic across semantic types'"
          if marker not in display:
              display += '''\n\ntest('Tashkent multilingual locality labels stay deterministic across semantic types', () => {\n  const tashkent = { country: 'UZ', city: 'Tashkent' };\n\n  assert.equal(geographyDisplayName(\"Qo'yliq-6\", 'uz', 'local_area', tashkent), 'Qo‘yliq-6 mavzesi');\n  assert.equal(geographyDisplayName(\"Qo'yliq-6\", 'ru', 'local_area', tashkent), 'Куйлюк-6');\n  assert.equal(geographyDisplayName('Qalqon', 'uz', 'mahalla', tashkent), 'Qalqon mahallasi');\n  assert.equal(geographyDisplayName('Qalqon', 'uz', 'local_area', tashkent), 'Qalqon mavzesi');\n  assert.equal(geographyDisplayName('Qalqon', 'ru', 'local_area', tashkent), 'массив Калкон');\n  assert.equal(geographyDisplayName(\"Bog'bon\", 'ru', 'mahalla', tashkent), 'Богбон');\n  assert.equal(geographyDisplayName(\"Bog'bon\", 'ru', 'local_area', tashkent), 'массив Богбон');\n  assert.equal(geographyDisplayName('Guruchariq', 'ru', 'local_area', tashkent), 'массив Гуручарик');\n  assert.equal(geographyDisplayName('Guruchariq', 'uz', 'local_area', tashkent), 'Guruchariq mavzesi');\n  assert.equal(geographyDisplayName('Beruniy-B1', 'uz', 'local_area', tashkent), 'Beruniy-B1 mavzesi');\n  assert.equal(geographyDisplayName('Parkent-Riyoziy', 'ru', 'local_area', tashkent), 'Паркент-Риёзий');\n  assert.equal(geographyDisplayName('Parkent-Siolkovskiy', 'ru', 'local_area', tashkent), 'Паркент-Сиолковский');\n});\n'''
              display_test.write_text(display, encoding='utf-8')

          matcher_test = Path('test/central-asia.test.js')
          matcher = matcher_test.read_text(encoding='utf-8')
          marker = "test('Tashkent historical and Uzbek-script locality aliases resolve to current canonicals'"
          if marker not in matcher:
              matcher += '''\n\ntest('Tashkent historical and Uzbek-script locality aliases resolve to current canonicals', () => {\n  const qalqon = matchCentralAsiaLocationEntities('Ҳарбийлар-58а шаҳарчаси', 'UZ', 'Tashkent');\n  assert.ok(names(qalqon, 'local_area').includes('Qalqon'));\n\n  const bogbon = matchCentralAsiaLocationEntities('Нормуҳаммедов мавзеси', 'UZ', 'Tashkent');\n  assert.ok(names(bogbon, 'local_area').includes(\"Bog'bon\"));\n\n  const guruchariq = matchCentralAsiaLocationEntities('Марказ-22', 'UZ', 'Tashkent');\n  assert.ok(names(guruchariq, 'local_area').includes('Guruchariq'));\n\n  const qoyliq = matchCentralAsiaLocationEntities('Қўйлиқ-6 мавзеси', 'UZ', 'Tashkent');\n  assert.ok(names(qoyliq, 'local_area').includes(\"Qo'yliq-6\"));\n\n  const siolkovskiy = matchCentralAsiaLocationEntities('Паркент-Сиолковский массив', 'UZ', 'Tashkent');\n  assert.ok(names(siolkovskiy, 'local_area').includes('Parkent-Siolkovskiy'));\n});\n'''
              matcher_test.write_text(matcher, encoding='utf-8')
          PY
      - name: Install
        run: npm install --ignore-scripts
      - name: Test
        run: npm test
      - name: Pack check
        run: npm pack --dry-run
      - name: Commit translation sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/uz-location-extensions.js test/geography-display.test.js test/central-asia.test.js
          if git diff --cached --quiet; then
            echo 'No translation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(uz): expand Tashkent locality translations'
          git push origin "HEAD:${GITHUB_REF_NAME}"
