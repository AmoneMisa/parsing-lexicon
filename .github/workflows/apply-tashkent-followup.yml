name: Apply Tashkent translation follow-up

on:
  push:
    branches:
      - data/tashkent-translations-2026-08-30

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('src/uz-location-extensions.js')
          text = source.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          for n, old_extra in [
              (1, ",'Водник-1','Водник 1'"),
              (2, ",'Водник-2','Водник 2'"),
              (3, ",'Водник-3','Водник 3'"),
              (4, ''),
              (5, ''),
          ]:
              base_aliases = f"'Suvsoz {n}','Suvsoz-{n} mavzesi','Сувсоз-{n}','Сувсоз {n}'{old_extra}"
              old = f"      {{ name: 'Suvsoz-{n}', aliases: [{base_aliases}], parent: 'Bektemir', confidence: 'official' }},"
              new_aliases = base_aliases + f",'Сувсоз-{n} мавзеси'"
              new = f"      {{ name: 'Suvsoz-{n}', aliases: [{new_aliases}], labels: {{ en: 'Suvsoz-{n}', uz: 'Suvsoz-{n} mavzesi', ru: 'Сувсоз-{n}' }}, parent: 'Bektemir', confidence: 'official' }},"
              replace_once(old, new)

          old_b3 = "      { name: 'Beruniy-B3', aliases: ['Beruniy B3','Beruniy B-3','Beruniy-B3 mavzesi','Beruniy B3 mavzesi','Беруний-Б3','Беруний Б3','Беруний-Б3 мавзе','Беруний-Б3 массив'], labels: { en: 'Beruniy-B3', uz: 'Beruniy-B3 mavzesi', ru: 'Беруний-Б3' }, parent: 'Almazar', confidence: 'official' },"
          new_b3 = "      { name: 'Beruniy-B3', aliases: ['Beruniy B3','Beruniy B-3','Beruniy-B3 mavzesi','Beruniy B3 mavzesi','Beruniy-3','Beruniy 3','Beruniy-3 mavzesi','Beruniy 3 dahasi','Беруни-3','Беруни 3','Беруний-3','Беруний 3','Беруний-Б3','Беруний Б3','Беруний-Б3 мавзе','Беруний-Б3 массив'], labels: { en: 'Beruniy-B3', uz: 'Beruniy-B3 mavzesi', ru: 'Беруний-Б3' }, parent: 'Almazar', confidence: 'official' },"
          replace_once(old_b3, new_b3)

          old_sugd_mfy = "      { name: \"Sug'diyona\", aliases: ['Sug‘diyona','Sugʻdiyona','Sugdiyona','Суғдиёна','Согдиана'], parent: 'Sergeli', confidence: 'official' },"
          new_sugd_mfy = "      { name: \"Sug'diyona\", aliases: [\"Sug'diyona mahallasi\",'Sug‘diyona','Sugʻdiyona','Sugdiyona','Суғдиёна','Суғдиёна маҳалласи','Согдиана','махалля Согдиана'], labels: { en: \"Sug'diyona\", uz: \"Sug'diyona mahallasi\", ru: 'махалля Согдиана' }, parent: 'Sergeli', confidence: 'official' },"
          replace_once(old_sugd_mfy, new_sugd_mfy)

          old_sugd_area = "      { name: \"Sug'diyona\", aliases: ['Sug‘diyona mavzesi','Sugʻdiyona mavzesi','Sugdiyona mavzesi','Суғдиёна мавзе','Согдиана массив'], parent: 'Sergeli', confidence: 'official' },"
          new_sugd_area = "      { name: \"Sug'diyona\", aliases: ['Sug‘diyona mavzesi','Sugʻdiyona mavzesi','Sugdiyona mavzesi','Суғдиёна мавзе','Суғдиёна мавзеси','Согдиана массив','массив Согдиана'], labels: { en: \"Sug'diyona\", uz: \"Sug'diyona mavzesi\", ru: 'массив Согдиана' }, parent: 'Sergeli', confidence: 'official' },"
          replace_once(old_sugd_area, new_sugd_area)

          source.write_text(text, encoding='utf-8')

          display_test = Path('test/geography-display.test.js')
          display = display_test.read_text(encoding='utf-8')
          marker = "test('Tashkent Suvsoz and Sug'diyona labels preserve locality semantics'"
          if marker not in display:
              display += '''\n\ntest("Tashkent Suvsoz and Sug'diyona labels preserve locality semantics", () => {\n  const tashkent = { country: 'UZ', city: 'Tashkent' };\n  assert.equal(geographyDisplayName('Suvsoz-4', 'uz', 'local_area', tashkent), 'Suvsoz-4 mavzesi');\n  assert.equal(geographyDisplayName('Suvsoz-4', 'ru', 'local_area', tashkent), 'Сувсоз-4');\n  assert.equal(geographyDisplayName(\"Sug'diyona\", 'uz', 'mahalla', tashkent), \"Sug'diyona mahallasi\");\n  assert.equal(geographyDisplayName(\"Sug'diyona\", 'uz', 'local_area', tashkent), \"Sug'diyona mavzesi\");\n  assert.equal(geographyDisplayName(\"Sug'diyona\", 'ru', 'mahalla', tashkent), 'махалля Согдиана');\n  assert.equal(geographyDisplayName(\"Sug'diyona\", 'ru', 'local_area', tashkent), 'массив Согдиана');\n});\n'''
              display_test.write_text(display, encoding='utf-8')

          matcher_test = Path('test/central-asia.test.js')
          matcher = matcher_test.read_text(encoding='utf-8')
          marker = "test('Tashkent Beruniy-3 and Suvsoz Cyrillic aliases resolve current canonicals'"
          if marker not in matcher:
              matcher += '''\n\ntest('Tashkent Beruniy-3 and Suvsoz Cyrillic aliases resolve current canonicals', () => {\n  const beruniy = matchCentralAsiaLocationEntities('Беруни-3, Ташкент', 'UZ', 'Tashkent');\n  assert.ok(names(beruniy, 'local_area').includes('Beruniy-B3'));\n\n  const suvsoz = matchCentralAsiaLocationEntities('Сувсоз-4 мавзеси', 'UZ', 'Tashkent');\n  assert.ok(names(suvsoz, 'local_area').includes('Suvsoz-4'));\n});\n'''
              matcher_test.write_text(matcher, encoding='utf-8')
          PY
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm pack --dry-run
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/uz-location-extensions.js test/geography-display.test.js test/central-asia.test.js
          git commit -m 'feat(uz): sync Suvsoz and Beruniy locality aliases'
          git push origin "HEAD:${GITHUB_REF_NAME}"
