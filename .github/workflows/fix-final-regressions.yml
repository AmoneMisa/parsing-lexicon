name: Fix final parsing regressions
on:
  push:
    branches: [feat/full-multilingual-domain-lexicon]
    paths: [.github/workflows/fix-final-regressions.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Apply contract fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=-1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:100]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # money.js: make source fragments non-capturing and keep explicit capture indexes stable.
          replace('src/money.js',
            "const NUMBER = '(\\\\d{1,3}(?:[ \\\\u00a0.,]\\\\d{3})+|\\\\d+(?:[.,]\\\\d+)?)';\nconst SCALE = '(k|к|тыс\\\\.?|тысяч(?:а|и)?|тис\\\\.?|thousand|ming|мың|m|м|млн\\\\.?|mln|million|миллион(?:ов)?|мільйон(?:ів)?|bn|млрд|mlrd|billion)';\nconst RANGE_RE = new RegExp(`${NUMBER}\\\\s*(${SCALE})?\\\\s*(?:-|–|—|до|to|bis|dan\\\\s+gacha)\\\\s*${NUMBER}\\\\s*(${SCALE})?`, 'iu');\nconst SINGLE_RE = new RegExp(`${NUMBER}\\\\s*(${SCALE})?`, 'giu');",
            "const NUMBER = '\\\\d{1,3}(?:[ \\\\u00a0.,]\\\\d{3})+|\\\\d+(?:[.,]\\\\d+)?';\nconst SCALE = 'k|к|тыс\\\\.?|тысяч(?:а|и)?|тис\\\\.?|thousand|ming|мың|m|м|млн\\\\.?|mln|million|миллион(?:ов)?|мільйон(?:ів)?|bn|млрд|mlrd|billion';\nconst RANGE_RE = new RegExp(`(${NUMBER})\\\\s*(${SCALE})?\\\\s*(?:-|–|—|до|to|bis|dan\\\\s+gacha)\\\\s*(${NUMBER})\\\\s*(${SCALE})?`, 'iu');\nconst SINGLE_RE = new RegExp(`(${NUMBER})\\\\s*(${SCALE})?`, 'giu');")
          replace('src/money.js',
            "    const firstScale = range[2] || range[5] || null;\n    const secondScale = range[5] || range[2] || null;\n    min = amount(range[1], firstScale);\n    max = amount(range[4], secondScale);",
            "    const firstScale = range[2] || range[4] || null;\n    const secondScale = range[4] || range[2] || null;\n    min = amount(range[1], firstScale);\n    max = amount(range[3], secondScale);")

          # hiring professions: public id is the canonical role; taxonomy path stays available separately.
          replace('src/hiring-professions.js',
            "    id: `profession.${group}.${canonical}`,\n    canonical,",
            "    id: canonical,\n    taxonomyId: `profession.${group}.${canonical}`,\n    canonical,")
          replace('src/hiring-professions.js',
            "['accountant','finance',['accountant','бухгалтер','бухгалтер','buxgalter','есепші']],",
            "['accountant','finance',['accountant','бухгалтер','бухгалтером','buxgalter','есепші']],")
          replace('src/hiring-professions.js',
            "['financial_analyst','finance',['financial analyst','финансовый аналитик','фінансовий аналітик']],",
            "['financial_analyst','finance',['financial analyst','финансовый аналитик','финансовым аналитиком','фінансовий аналітик']],")
          replace('src/hiring-professions.js',
            "{ canonical: 'lead', aliases: ['team lead','teamlead','tech lead','lead developer','lead engineer'",
            "{ canonical: 'lead', aliases: ['lead','team lead','teamlead','tech lead','lead developer','lead engineer'")

          # One canonical semantic for candidate language possession.
          replace('src/hiring-languages.js',
            "  candidateKnows: group('candidateKnows', {",
            "  candidateHas: group('candidateHas', {")

          # Generic metro is a valid infrastructure POI.
          replace('src/landmarks.js',
            "  group('Park', { ru: ['парк'], en: ['park'], uk: ['парк'], ro: ['parc'], uzLatn: [\"bog'\", 'bog‘', 'bogʻ', 'park'], uzCyrl: ['боғ', 'парк'], kk: ['саябақ', 'парк'] }),",
            "  group('Park', { ru: ['парк'], en: ['park'], uk: ['парк'], ro: ['parc'], uzLatn: [\"bog'\", 'bog‘', 'bogʻ', 'park'], uzCyrl: ['боғ', 'парк'], kk: ['саябақ', 'парк'] }),\n  group('Metro', { ru: ['метро', 'станция метро'], en: ['metro', 'subway station'], uk: ['метро', 'станція метро'], ro: ['metrou', 'stație de metrou'], uzLatn: ['metro', 'metro bekati'], uzCyrl: ['метро', 'метро бекати'], kk: ['метро', 'метро станциясы'] }),")

          # Room-count boundaries must be Unicode-aware; JS \b is ASCII-oriented.
          p = Path('src/housing-structured.js')
          text = p.read_text()
          start = text.index('const NUMBER_WORDS = Object.freeze([')
          end = text.index(']);', start) + 3
          block = text[start:end]
          block = block.replace('[/\\b(?:', '[/(?<![\\p{L}\\p{N}_])(?:').replace(')\\b/iu,', ')(?![\\p{L}\\p{N}_])/iu,')
          if block == text[start:end]:
              raise SystemExit('room boundary patch made no change')
          text = text[:start] + block + text[end:]
          p.write_text(text)

          # Bind the nearest distance mention to each POI instead of taking the first one in a wide window.
          replace('src/housing-structured.js',
            "function distanceFromWindow(window) {\n  const minutes = window.match(/(\\d{1,3})\\s*(?:мин(?:ут[аы]?)?|minutes?|min\\.?|daqiqa|минут|мин|минөт)/iu);\n  if (minutes) {\n    const mode = /(?:пешком|walk(?:ing)?|on\\s+foot|piyoda|жаяу)/iu.test(window)\n      ? 'walk'\n      : /(?:на\\s+машине|by\\s+car|drive|mashinada|көлікпен)/iu.test(window) ? 'drive' : null;\n    return { value: Number(minutes[1]), unit: 'minute', mode };\n  }\n  const metric = window.match(/(\\d{1,4}(?:[.,]\\d+)?)\\s*(км|km|километр\\p{L}*|м|meter(?:s)?|метр\\p{L}*)/iu);\n  if (!metric) return null;\n  const rawUnit = metric[2].toLocaleLowerCase();\n  return { value: toNumber(metric[1]), unit: /км|km|километр/u.test(rawUnit) ? 'kilometer' : 'meter', mode: null };\n}",
            "function distanceFromWindow(window, entityOffset = 0) {\n  const candidates = [];\n  const minuteRe = /(\\d{1,3})\\s*(?:мин(?:ут[аы]?)?|minutes?|min\\.?|daqiqa|минут|мин|минөт)/giu;\n  for (const match of window.matchAll(minuteRe)) {\n    const index = match.index ?? 0;\n    const local = window.slice(Math.max(0, index - 18), Math.min(window.length, index + match[0].length + 28));\n    const mode = /(?:пешком|walk(?:ing)?|on\\s+foot|piyoda|жаяу)/iu.test(local)\n      ? 'walk'\n      : /(?:на\\s+машине|by\\s+car|drive|mashinada|көлікпен)/iu.test(local) ? 'drive' : null;\n    candidates.push({ distance: Math.abs(index - entityOffset), value: Number(match[1]), unit: 'minute', mode });\n  }\n  const metricRe = /(\\d{1,4}(?:[.,]\\d+)?)\\s*(км|km|километр\\p{L}*|м|meter(?:s)?|метр\\p{L}*)/giu;\n  for (const match of window.matchAll(metricRe)) {\n    const index = match.index ?? 0;\n    const rawUnit = match[2].toLocaleLowerCase();\n    candidates.push({ distance: Math.abs(index - entityOffset), value: toNumber(match[1]), unit: /км|km|километр/u.test(rawUnit) ? 'kilometer' : 'meter', mode: null });\n  }\n  candidates.sort((a, b) => a.distance - b.distance);\n  if (!candidates.length) return null;\n  const { value, unit, mode } = candidates[0];\n  return { value, unit, mode };\n}")
          replace('src/housing-structured.js',
            "      distance: distanceFromWindow(window),",
            "      distance: distanceFromWindow(window, match.start - left),")

          # Neutral Kazakh rent token allows deal classification without encoding transaction side.
          replace('src/housing-intent.js',
            "    kk: ['жалдау', 'ұзақ мерзімге', 'айлық жалдау'],",
            "    kk: ['жалдау', 'жалға', 'ұзақ мерзімге', 'айлық жалдау'],")

          # Compound negative floor wording: 'не первый и не последний этаж'.
          replace('src/housing-context.js',
            "function resolveFloorConstraints(text) {\n  const values = all(text, FLOOR_CONSTRAINT_TERMS);\n  const out = new Set(values);",
            "function resolveFloorConstraints(text) {\n  const values = all(text, FLOOR_CONSTRAINT_TERMS);\n  const out = new Set(values);\n  if (/(?:не\\s+(?:первый|1)|not\\s+first|не\\s+перший|nu\\s+primul|birinchi\\s+qavat\\s+emas|бірінші\\s+қабат\\s+емес)[^.!?\\n]{0,32}(?:этаж|floor|поверх|etaj|qavat|қабат)/iu.test(text)) out.add('notFirst');")

          # Ukraine major-city extensions can carry streets; add Kharkiv's core Sumska street.
          replace('src/ua-location-extensions-major.js',
            "function city({ districts = [], microdistricts = [], residentialComplexes = [], landmarks = [] }) {",
            "function city({ districts = [], microdistricts = [], residentialComplexes = [], streets = [], landmarks = [] }) {")
          replace('src/ua-location-extensions-major.js',
            "    ...(residentialComplexes.length ? { residentialComplexes: locationEntries(residentialComplexes) } : {}),\n    ...(landmarks.length ? { landmarks: locationEntries(landmarks) } : {}),",
            "    ...(residentialComplexes.length ? { residentialComplexes: locationEntries(residentialComplexes) } : {}),\n    ...(streets.length ? { streets: locationEntries(streets) } : {}),\n    ...(landmarks.length ? { landmarks: locationEntries(landmarks) } : {}),")
          kh = "  Kharkiv: city({\n    districts: ["
          if kh not in Path('src/ua-location-extensions-major.js').read_text():
              raise SystemExit('Kharkiv city marker missing')
          replace('src/ua-location-extensions-major.js', kh,
            "  Kharkiv: city({\n    streets: [\n      ['Sumska Street','вул. Сумська','вулиця Сумська','Сумська','ул. Сумская','улица Сумская','Сумская','Sumska Street','Sumska'],\n    ],\n    districts: [")

          # Duplicate aliases are structural errors only within the same language bucket.
          p = Path('src/normalization.js')
          text = p.read_text()
          old = """    const aliases = aliasesOf(entry);\n    const localNormalized = new Map();\n    for (const [aliasIndex, alias] of aliases.entries()) {\n      if (typeof alias !== 'string' || !alias.trim()) {\n        errors.push(Object.freeze({ kind: 'emptyAlias', canonical, aliasIndex, entryIndex }));\n        continue;\n      }\n      const normalized = normalizeForMatch(alias);\n      if (!normalized) {\n        errors.push(Object.freeze({ kind: 'emptyNormalizedAlias', canonical, alias, aliasIndex, entryIndex }));\n        continue;\n      }\n      if (localNormalized.has(normalized)) {\n        errors.push(Object.freeze({ kind: 'duplicateAlias', canonical, alias, normalizedAlias: normalized, firstAliasIndex: localNormalized.get(normalized), aliasIndex, entryIndex }));\n      } else {\n        localNormalized.set(normalized, aliasIndex);\n      }\n\n      const owners = aliasOwners.get(normalized) || new Set();\n      owners.add(canonical);\n      aliasOwners.set(normalized, owners);\n    }"""
          new = """    const aliasMapEntries = aliasMap && !Array.isArray(aliasMap) && typeof aliasMap === 'object'\n      ? Object.entries(aliasMap).flatMap(([language, values]) => (Array.isArray(values) ? values : []).map((alias, aliasIndex) => ({ alias, aliasIndex, language })))\n      : (Array.isArray(aliasMap) ? aliasMap : []).map((alias, aliasIndex) => ({ alias, aliasIndex, language: null }));\n    const localNormalized = new Map();\n    for (const { alias, aliasIndex, language } of aliasMapEntries) {\n      if (typeof alias !== 'string' || !alias.trim()) {\n        errors.push(Object.freeze({ kind: 'emptyAlias', canonical, aliasIndex, entryIndex, language }));\n        continue;\n      }\n      const normalized = normalizeForMatch(alias);\n      if (!normalized) {\n        errors.push(Object.freeze({ kind: 'emptyNormalizedAlias', canonical, alias, aliasIndex, entryIndex, language }));\n        continue;\n      }\n      const duplicateKey = `${language || '*'}:${normalized}`;\n      if (localNormalized.has(duplicateKey)) {\n        errors.push(Object.freeze({ kind: 'duplicateAlias', canonical, alias, normalizedAlias: normalized, firstAliasIndex: localNormalized.get(duplicateKey), aliasIndex, entryIndex, language }));\n      } else {\n        localNormalized.set(duplicateKey, aliasIndex);\n      }\n\n      const owners = aliasOwners.get(normalized) || new Set();\n      owners.add(canonical);\n      aliasOwners.set(normalized, owners);\n    }"""
          if old not in text:
              raise SystemExit('validator block missing')
          p.write_text(text.replace(old, new))
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close final parsing regressions'
          git push
