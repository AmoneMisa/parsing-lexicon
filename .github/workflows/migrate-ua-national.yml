name: Migrate UA national location catalog

on:
  push:
    branches:
      - feat/ua-geo-dependencies
    paths:
      - scripts/migrate-ua-national.mjs
      - .github/workflows/migrate-ua-national.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ua-geo-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/migrate-ua-national.mjs
      - run: |
          git add src/ua-location-extensions-national.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(ua): embed official national locations in native model'
          git push origin HEAD:feat/ua-geo-dependencies
