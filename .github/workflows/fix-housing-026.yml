name: Validate housing gaps 0.2.6

on:
  push:
    branches:
      - fix/housing-consumer-gaps-026
    paths:
      - '.github/workflows/fix-housing-026.yml'
      - '.github/scripts/fix_housing_026.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/housing-consumer-gaps-026
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 .github/scripts/fix_housing_026.py
      - run: npm install
      - run: npm test
      - run: |
          git rm .github/scripts/fix_housing_026.py .github/workflows/fix-housing-026.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test package.json package-lock.json
          git commit -m 'Fix shared housing consumer regressions'
          git push origin HEAD:fix/housing-consumer-gaps-026
