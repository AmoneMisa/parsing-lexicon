name: Fix final parsing contracts
on:
  push:
    branches: [feat/full-multilingual-domain-lexicon]
    paths: [.github/workflows/fix-final-contracts.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Apply final contract fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # Currency symbols are meaningful tokens even though lexical text normalization
          # intentionally strips punctuation for word matching.
          replace('src/money.js',
            "function currencyFromText(text) {\n  return findCanonical(text, CURRENCY_TERMS, { partial: true })?.canonical || null;\n}",
            "function currencyFromText(text) {\n  if (text.includes('$')) return 'USD';\n  if (text.includes('€')) return 'EUR';\n  if (text.includes('₴')) return 'UAH';\n  if (text.includes('₽')) return 'RUB';\n  if (text.includes('£')) return 'GBP';\n  if (text.includes('₺')) return 'TRY';\n  if (text.includes('₾')) return 'GEL';\n  return findCanonical(text, CURRENCY_TERMS, { partial: true })?.canonical || null;\n}")

          # Role morphology/plurals and standalone staff seniority.
          replace('src/hiring-professions.js',
            "['software_developer','software_development',['software developer','software engineer','programmer','программист','разработчик ПО','розробник ПЗ','dasturchi','бағдарламашы'],['developer','разработчик']],",
            "['software_developer','software_development',['software developer','software developers','software engineer','software engineers','programmer','programmers','программист','программисты','разработчик ПО','разработчики ПО','розробник ПЗ','розробники ПЗ','dasturchi','бағдарламашы'],['developer','developers','разработчик','разработчики','разработчиками']],")
          replace('src/hiring-professions.js',
            "{ canonical: 'staff', aliases: ['staff engineer','staff developer','staff-level','стафф инженер'], score: 1 },",
            "{ canonical: 'staff', aliases: ['staff','staff engineer','staff developer','staff-level','стафф','стафф инженер'], score: 1 },")

          # A direct 'worked <role>' sentence is previous employment context too.
          replace('src/hiring-context.js',
            "/работал[аи]?\\s+(?:в|как)|працюва|worked\\s+(?:at|as)|previous\\s+(?:role|company)|ilgari\\s+ish|бұрын\\s+жұмыс/iu",
            "/работал[аи]?(?:\\s+(?:в|как))?|працюва|worked\\s+(?:at|as)|previous\\s+(?:role|company)|ilgari\\s+ish|бұрын\\s+жұмыс/iu")

          # Russian case forms for proximity POIs.
          replace('src/landmarks.js',
            "group('School', { ru: ['школа'], en: ['school'], uk: ['школа'],",
            "group('School', { ru: ['школа', 'школы', 'школу', 'школе'], en: ['school'], uk: ['школа', 'школи', 'школу'],")

          # Apostrophe variants normalize identically, so keep one canonical spelling per
          # language bucket rather than storing redundant aliases.
          replace('src/countries.js',
            "uzLatn: [\"O'zbekiston\", 'O‘zbekiston', 'Oʻzbekiston', \"O'zbekiston Respublikasi\", 'Ozbekiston'],",
            "uzLatn: [\"O'zbekiston\", \"O'zbekiston Respublikasi\", 'Ozbekiston'],")
          replace('src/countries.js',
            "uzLatn: [\"Qozog'iston\", 'Qozog‘iston', 'Qozogʻiston', \"Qozog'iston Respublikasi\"],",
            "uzLatn: [\"Qozog'iston\", \"Qozog'iston Respublikasi\"],")
          replace('src/countries.js',
            "uzLatn: [\"Qirg'iziston\", 'Qirg‘iziston', 'Qirgʻiziston'],",
            "uzLatn: [\"Qirg'iziston\"],")

          # Share the directional Kazakh surface phrase instead of duplicating literals
          # between action and transaction-mechanics taxonomies.
          replace('src/housing-intent.js',
            "const group = (canonical, aliases, extra = {}) => lexiconEntity(canonical, aliases, extra);\n\nexport const HOUSING_ACTIONS",
            "const group = (canonical, aliases, extra = {}) => lexiconEntity(canonical, aliases, extra);\nconst KK_RENT_OUT_ALIASES = Object.freeze(['жалға беремін', 'жалға беріледі']);\n\nexport const HOUSING_ACTIONS")
          replace('src/housing-intent.js',
            "kk: ['жалға беремін', 'жалға беріледі'],",
            "kk: KK_RENT_OUT_ALIASES,")
          replace('src/housing-intent.js',
            "kk: ['жалдау', 'жалға', 'ұзақ мерзімге', 'айлық жалдау'],",
            "kk: ['жалдау', 'жалға', ...KK_RENT_OUT_ALIASES, 'ұзақ мерзімге', 'айлық жалдау'],")

          # The public dictionary matcher must use the same merged Ukraine extensions
          # as canonical consumers; otherwise extension-only streets/metro are invisible.
          replace('src/locations.js',
            "import { UA_REGIONS as UA_REGION_LEXICON } from './geography.js';",
            "import { UA_REGIONS as UA_REGION_LEXICON } from './geography.js';\nimport { mergeLocationCityDictionaries } from './location-merge.js';\nimport { UA_MAJOR_LOCATION_EXTENSIONS } from './ua-location-extensions-major.js';\nimport { UA_REGIONAL_LOCATION_EXTENSIONS } from './ua-location-extensions-regional.js';\nimport { UA_METRO_LOCATION_EXTENSIONS } from './ua-location-extensions-metro.js';")
          replace('src/locations.js',
            "export function locationCities(countryCode) {\n  if (countryCode !== 'UA') return LOCATION_DICTIONARIES[countryCode] || {};\n  return Object.freeze({ ...UA_EXTRA_LOCATION_DICTIONARIES, ...(LOCATION_DICTIONARIES.UA || {}) });\n}",
            "export function locationCities(countryCode) {\n  if (countryCode !== 'UA') return LOCATION_DICTIONARIES[countryCode] || {};\n  const legacy = { ...UA_EXTRA_LOCATION_DICTIONARIES, ...(LOCATION_DICTIONARIES.UA || {}) };\n  const names = [...new Set([\n    ...Object.keys(legacy),\n    ...Object.keys(UA_MAJOR_LOCATION_EXTENSIONS),\n    ...Object.keys(UA_REGIONAL_LOCATION_EXTENSIONS),\n    ...Object.keys(UA_METRO_LOCATION_EXTENSIONS),\n  ])];\n  return Object.freeze(Object.fromEntries(names.map((city) => [\n    city,\n    mergeLocationCityDictionaries(\n      legacy[city],\n      UA_MAJOR_LOCATION_EXTENSIONS[city],\n      UA_REGIONAL_LOCATION_EXTENSIONS[city],\n      UA_METRO_LOCATION_EXTENSIONS[city],\n    ),\n  ])));\n}")
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align final parsing contracts'
          git push
