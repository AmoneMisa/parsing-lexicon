name: Validate candidate semantic edge fix

on:
  push:
    paths:
      - '.github/workflows/fix-hiring-semantic-edge.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch Cyrillic online non-role value
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/hiring-semantics.js')
          text = path.read_text()
          old = '|remote|onlayn|online|farqi'
          new = '|remote|onlayn|online|онлайн|farqi'
          if text.count(old) != 1:
              raise SystemExit(f'expected one NON_ROLE_RE segment, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm test
      - name: Commit validated fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hiring-semantic-edge.yml
          git add src/hiring-semantics.js
          git commit -m "fix: recognize Cyrillic online role value"
          git push
