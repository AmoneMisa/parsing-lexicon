name: Generate UA KATOTTG snapshot

on:
  push:
    branches:
      - feat/ua-geo-dependencies
    paths:
      - scripts/generate-ua-katottg.py
      - .github/workflows/generate-ua-katottg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ua-geo-dependencies
          fetch-depth: 0
      - name: Generate official KATOTTG snapshot
        run: |
          python scripts/generate-ua-katottg.py \
            --url 'https://mindev.gov.ua/storage/app/sites/1/uploaded-files/kodifikator-07-07.xlsx' \
            --snapshot '2026-07-07'
      - name: Optimize unified UA location dictionaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/locations.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('export function locationCities(countryCode) {')
          end = s.index('\n\nexport function matchDictionaryLocation', start)
          block = '''let uaLocationCitiesCache = null;

export function locationCities(countryCode) {
  if (countryCode !== 'UA') return LOCATION_DICTIONARIES[countryCode] || {};
  if (uaLocationCitiesCache) return uaLocationCitiesCache;

  const legacy = { ...UA_EXTRA_LOCATION_DICTIONARIES, ...(LOCATION_DICTIONARIES.UA || {}) };
  const names = [...new Set([
    ...Object.keys(legacy),
    ...Object.keys(UA_MAJOR_LOCATION_EXTENSIONS),
    ...Object.keys(UA_REGIONAL_LOCATION_EXTENSIONS),
    ...Object.keys(UA_SECONDARY_LOCATION_EXTENSIONS),
    ...Object.keys(UA_METRO_LOCATION_EXTENSIONS),
    ...Object.keys(UA_KATOTTG_LOCATION_EXTENSIONS),
  ])];

  uaLocationCitiesCache = Object.freeze(Object.fromEntries(names.map((city) => {
    const katottg = UA_KATOTTG_LOCATION_EXTENSIONS[city];
    const curated = [
      legacy[city],
      UA_MAJOR_LOCATION_EXTENSIONS[city],
      UA_REGIONAL_LOCATION_EXTENSIONS[city],
      UA_SECONDARY_LOCATION_EXTENSIONS[city],
      UA_METRO_LOCATION_EXTENSIONS[city],
    ].filter(Boolean);

    if (katottg && curated.length === 0) return [city, katottg];

    return [city, mergeLocationCityDictionaries(
      legacy[city],
      UA_MAJOR_LOCATION_EXTENSIONS[city],
      UA_REGIONAL_LOCATION_EXTENSIONS[city],
      UA_SECONDARY_LOCATION_EXTENSIONS[city],
      katottg,
      UA_METRO_LOCATION_EXTENSIONS[city],
    )];
  })));
  return uaLocationCitiesCache;
}'''
          if 'let uaLocationCitiesCache = null;' not in s:
              p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY
      - name: Commit generated data
        run: |
          git add src/generated/ua-katottg.json src/generated/ua-katottg.js src/locations.js
          if git diff --cached --quiet; then
            echo 'Generated snapshot and location model are unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(ua): cache nationwide location dictionaries'
          git push origin HEAD:feat/ua-geo-dependencies
