name: Migrate shared hiring skills

on:
  push:
    paths:
      - '.github/workflows/migrate-hiring-skills.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Import skill catalog from Personal-Site
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/AmoneMisa/Personal-Site/master/shared/jobSkills.ts -o /tmp/jobSkills.ts
          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/jobSkills.ts').read_text()
          start = src.find('// These canonical labels')
          if start < 0:
              raise SystemExit('skill catalog start marker not found')
          text = src[start:]
          replacements = {
              "const AMBIGUOUS_CANONICALS = new Set(['C', 'Go', 'Make', 'REST', 'Spring'])": "const AMBIGUOUS_CANONICALS = new Set(['C', 'Go', 'Make', 'REST', 'Spring'])",
              'const group = (category: string, subcategory: string, entries: SkillEntry[]): SkillDefinition[] =>': 'const group = (category, subcategory, entries) =>',
              'export const SKILL_CATALOG: SkillDefinition[] =': 'export const SKILL_CATALOG =',
              'export const SKILL_KEYWORDS: Readonly<Record<string, readonly string[]>> =': 'export const SKILL_KEYWORDS =',
              'export const SKILL_META: Readonly<Record<string, SkillMeta>> =': 'export const SKILL_META =',
              'export function normalizeSkillText(value: string): string {': 'export function normalizeSkillText(value) {',
              'export function escapeRegex(value: string): string {': 'export function escapeRegex(value) {',
              'export function buildSkillRegex(alias: string): RegExp {': 'export function buildSkillRegex(alias) {',
              'const CANONICAL_BY_ALIAS = new Map<string, string>()': 'const CANONICAL_BY_ALIAS = new Map()',
              'export function canonicalSkillName(value: string): string | undefined {': 'export function canonicalSkillName(value) {',
              'export function extractSkillDetails(text: string): SkillDetail[] {': 'export function extractSkillDetails(text) {',
              '  const found: SkillDetail[] = []': '  const found = []',
              'export function extractSkillNames(text: string): string[] {': 'export function extractSkillNames(text) {',
              'export function getSkillMeta(name: string): SkillMeta | undefined {': 'export function getSkillMeta(name) {',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match for {old!r}, got {count}')
              text = text.replace(old, new, 1)
          if ': string' in text or ': Skill' in text or 'Readonly<Record' in text or 'new Map<' in text:
              raise SystemExit('TypeScript annotations remain in generated skill module')
          Path('src/hiring-skills.js').write_text(text)
          PY

          cat > src/hiring-skills.d.ts <<'EOF'
          export interface SkillMeta {
            category: string;
            subcategory: string;
          }
          export interface SkillDefinition extends SkillMeta {
            name: string;
            aliases: string[];
          }
          export interface SkillDetail extends SkillMeta {
            name: string;
          }
          export const SKILL_CATALOG: SkillDefinition[];
          export const SKILL_KEYWORDS: Readonly<Record<string, readonly string[]>>;
          export const SKILL_META: Readonly<Record<string, SkillMeta>>;
          export function normalizeSkillText(value: string): string;
          export function escapeRegex(value: string): string;
          export function buildSkillRegex(alias: string): RegExp;
          export function canonicalSkillName(value: string): string | undefined;
          export function extractSkillDetails(text: string): SkillDetail[];
          export function extractSkillNames(text: string): string[];
          export function getSkillMeta(name: string): SkillMeta | undefined;
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('package.json')
          data = json.loads(path.read_text())
          exports = data['exports']
          if './hiring-skills' in exports:
              raise SystemExit('hiring-skills export already exists')
          rebuilt = {}
          for key, value in exports.items():
              rebuilt[key] = value
              if key == './hiring-professions':
                  rebuilt['./hiring-skills'] = {
                      'types': './src/hiring-skills.d.ts',
                      'import': './src/hiring-skills.js',
                  }
          data['exports'] = rebuilt
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

          cat > test/hiring-skills.test.js <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {
            canonicalSkillName,
            extractSkillDetails,
            extractSkillNames,
            getSkillMeta,
          } from '../src/hiring-skills.js';

          test('shared skill catalog canonicalizes aliases and preserves metadata', () => {
            assert.equal(canonicalSkillName('vue.js'), 'Vue');
            assert.equal(canonicalSkillName('postgres'), 'PostgreSQL');
            assert.equal(canonicalSkillName('scss'), 'Sass');
            assert.deepEqual(getSkillMeta('nuxt.js'), { category: 'IT', subcategory: 'Frontend' });
          });

          test('shared skill matcher preserves unicode-aware token boundaries', () => {
            const names = extractSkillNames('Vue.js, TypeScript, PostgreSQL, Docker');
            for (const name of ['Vue', 'TypeScript', 'PostgreSQL', 'Docker']) assert.ok(names.includes(name));
            assert.equal(extractSkillNames('reactive user interactions').includes('React'), false);
          });

          test('shared skill details keep categories for ATS and enrichment consumers', () => {
            const detail = extractSkillDetails('Kubernetes').find(({ name }) => name === 'Kubernetes');
            assert.deepEqual(detail, { name: 'Kubernetes', category: 'IT', subcategory: 'DevOps & Cloud' });
          });
          EOF

      - run: npm test
      - name: Commit migrated catalog and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/migrate-hiring-skills.yml
          git add src/hiring-skills.js src/hiring-skills.d.ts test/hiring-skills.test.js package.json
          git commit -m "feat: centralize hiring skill catalog"
          git push
