name: Fix final lexicon housekeeping
on:
  push:
    branches: [feat/full-multilingual-domain-lexicon]
    paths: [.github/workflows/fix-final-housekeeping.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Apply final housekeeping fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # Merge city aliases by their public normalization key, not punctuation spelling.
          replace('src/central-asia.js',
            "import { aliasesOf, findCanonical } from './normalization.js';",
            "import { aliasesOf, findCanonical, normalizeForMatch } from './normalization.js';")
          replace('src/central-asia.js',
            "    const aliases = Object.fromEntries(languages.map((lang) => [\n      lang,\n      [...new Set([...(previous.aliases?.[lang] || []), ...(item.aliases?.[lang] || [])])],\n    ]));",
            "    const aliases = Object.fromEntries(languages.map((lang) => {\n      const seen = new Set();\n      const values = [...(previous.aliases?.[lang] || []), ...(item.aliases?.[lang] || [])].filter((alias) => {\n        const key = normalizeForMatch(alias);\n        if (!key || seen.has(key)) return false;\n        seen.add(key);\n        return true;\n      });\n      return [lang, values];\n    }));")

          # A named residential complex containing a metro name is more specific than the
          # station token, while metro still outranks ordinary street/landmark matches.
          replace('src/locations.js',
            "for (const type of ['districts', 'microdistricts', 'metro', 'residentialComplexes', 'streets', 'landmarks'])",
            "for (const type of ['districts', 'microdistricts', 'residentialComplexes', 'metro', 'streets', 'landmarks'])")

          # Keep one source for Romanian sale-offer wording while exposing it to both
          # directional action and transaction-mechanics matching.
          replace('src/housing-intent.js',
            "const KK_RENT_OUT_ALIASES = Object.freeze(['жалға беремін', 'жалға беріледі']);",
            "const KK_RENT_OUT_ALIASES = Object.freeze(['жалға беремін', 'жалға беріледі']);\nconst RO_SALE_OFFER_ALIASES = Object.freeze(['de vânzare', 'de vanzare']);")
          replace('src/housing-intent.js',
            "ro: ['vând', 'vand', 'de vânzare', 'de vanzare', 'se vinde'],",
            "ro: ['vând', 'vand', ...RO_SALE_OFFER_ALIASES, 'se vinde'],")
          replace('src/housing-intent.js',
            "ro: ['vânzare', 'vanzare', 'cumpărare', 'cumparare'],",
            "ro: ['vânzare', 'vanzare', ...RO_SALE_OFFER_ALIASES, 'cumpărare', 'cumparare'],")
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git diff --cached --quiet && exit 0
          git commit -m 'fix: close lexicon housekeeping regressions'
          git push
