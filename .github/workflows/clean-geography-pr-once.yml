name: Clean geography PR once

on:
  push:
    branches:
      - refactor/close-geography-catalog-gap

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/close-geography-catalog-gap
      - name: Remove generated dependency tree
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          cat > .gitignore <<'EOF'
          node_modules/
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --cached --ignore-unmatch node_modules package-lock.json
          rm .github/workflows/clean-geography-pr-once.yml
          git add .gitignore .github/workflows/clean-geography-pr-once.yml
          git commit -m 'chore: keep generated dependencies out of repository'
          git push origin HEAD:refactor/close-geography-catalog-gap
