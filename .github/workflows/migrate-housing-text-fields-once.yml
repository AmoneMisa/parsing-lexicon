name: Migrate remaining housing text fields once

on:
  push:
    branches:
      - feat/housing-text-fields

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/housing-text-fields
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extend package-owned housing text parsers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/housing-text.js')
          s = p.read_text()
          append = r'''

export function parseHousingAreaFromText(value) {
  const text = String(value || '');
  if (!text) return null;
  const match =
    text.match(/(\d{2,4})\s*(?:m2|m²|мкв|м2|м²|sq ?m|кв\.?\s*м|квадрат[а-яё]*)/i) ||
    text.match(/(?:^|\n)[^\d\r\n]{0,8}[1-9]\s*[¹²³⁴⁵⁶⁷⁸⁹]?\s*\/\s*[0-9]{1,2}\s*\/\s*[0-9]{1,2}\s+(\d{2,4})\s*кв(?=\s|$)/im);
  return match ? Number(match[1]) : null;
}

export function parseHousingFloorFromText(value) {
  const text = String(value || '');
  if (!text) return { floor: null, totalFloors: null };
  const t = text.toLowerCase();
  const floorWord = '(?:этаж(?:да)?|поверх|qavat|қабат|қабатт|etaj|floor|эт\\.)';
  const valid = (floor, total) => floor >= 0 && floor <= 200 && (total == null || (total >= floor && total <= 200));

  if (/(?:^|\n)[^\d\r\n]{0,8}[1-9]\s*\/\s*0\s*\/\s*-1\s*(?:этаж|эт\.?)?[^\r\n]*(?:подвал|цоколь)/im.test(t)) return { floor: -1, totalFloors: null };

  const compact = t.match(/(?:^|\n)[^\d\r\n]{0,8}[1-9]\s*[¹²³⁴⁵⁶⁷⁸⁹]?\s*\/\s*([0-9]{1,2})\s*\/\s*([0-9]{1,2})[.,;:]?(?=\s|$)/m);
  if (compact) {
    const floor = Number(compact[1]);
    const total = Number(compact[2]);
    if (floor >= 1 && floor <= 40 && total >= 2 && total <= 40 && floor <= total) return { floor, totalFloors: total };
  }

  const labelledPair = t.match(/([1-9]\d?)\s*-?\s*(?:qavat|этаж|поверх|қабат)\s*(?:\/|из|iz|of)\s*([1-9]\d?)\s*-?\s*(?:qavatli|qavat|этаж(?:ей|ный)?|поверх(?:ів|овий)?|қабатты?)/i);
  if (labelledPair) {
    const floor = Number(labelledPair[1]);
    const total = Number(labelledPair[2]);
    if (floor <= 40 && total <= 40 && floor <= total) return { floor, totalFloors: total };
  }

  const sep = '(?:\\/|из|iz|of)';
  const pair = t.match(new RegExp(`${floorWord}\\D{0,4}(\\d{1,2})\\s*${sep}\\s*(\\d{1,2})`)) || t.match(new RegExp(`(\\d{1,2})\\s*${sep}\\s*(\\d{1,2})\\s*${floorWord}`));
  if (pair) {
    const floor = Number(pair[1]);
    const total = Number(pair[2]);
    if (valid(floor, total)) return { floor, totalFloors: total };
  }

  const notLetter = '(?!н|ей|ів|ност|ка|ки|s)';
  const single = t.match(new RegExp(`(\\d{1,2})[^\\S\\r\\n]*-?[^\\S\\r\\n]*(?:го|ом|ым|ой|ий|nd|rd|th|st|й|м|е)?[^\\S\\r\\n]*${floorWord}${notLetter}`)) || t.match(new RegExp(`${floorWord}\\s*[:№#]?\\s*(\\d{1,2})\\b`));
  if (single) {
    const floor = Number(single[1]);
    if (valid(floor, null)) {
      const explicitTotal = t.match(/(?:этажность|этажей|поверхови|поверховість|qavatlar(?:\s*soni)?|qavatli|қабатты?)\D{0,6}(\d{1,2})/);
      const leadingTotal = t.match(/([1-9]\d?)\s*-?\s*(?:этажн[а-яё]*|поверхов[а-яіїґ]*|qavatli|қабатты?)\s*(?:дом|здани|будин|uy|bino)?/i);
      const total = explicitTotal ? Number(explicitTotal[1]) : leadingTotal ? Number(leadingTotal[1]) : null;
      return { floor, totalFloors: total && total >= floor && total <= 200 ? total : null };
    }
  }

  const bare = t.match(/(?<![\d/])([1-9]\d?)\s*\/\s*([1-9]\d?)(?![\d/])/);
  if (bare) {
    const floor = Number(bare[1]);
    const total = Number(bare[2]);
    if (floor >= 1 && floor <= 40 && total >= 2 && total <= 40 && floor <= total) return { floor, totalFloors: total };
  }
  return { floor: null, totalFloors: null };
}
'''
          if 'export function parseHousingAreaFromText' in s:
              raise SystemExit('area parser already exists')
          p.write_text(s.rstrip() + append + '\n')

          p = Path('src/housing-text.d.ts')
          p.write_text(p.read_text().rstrip() + "\nexport declare function parseHousingAreaFromText(value: unknown): number | null;\nexport declare function parseHousingFloorFromText(value: unknown): { floor: number | null; totalFloors: number | null };\n")

          p = Path('package.json')
          s = p.read_text().replace('"version": "0.2.3"', '"version": "0.2.4"')
          p.write_text(s)
          PY
      - name: Add compatibility tests
        run: |
          cat > test/housing-text-fields-compat.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { parseHousingAreaFromText, parseHousingFloorFromText } from '../src/housing-text.js';

          test('housing text area parser preserves legacy free-text forms', () => {
            assert.equal(parseHousingAreaFromText('Площадь 80 квадратов'), 80);
            assert.equal(parseHousingAreaFromText('2/5/16 56кв'), 56);
            assert.equal(parseHousingAreaFromText('Chilonzor 16кв'), null);
          });

          test('housing text floor parser preserves compact and labelled forms', () => {
            assert.deepEqual(parseHousingFloorFromText('2/5/16'), { floor: 5, totalFloors: 16 });
            assert.deepEqual(parseHousingFloorFromText('2³/4/4'), { floor: 4, totalFloors: 4 });
            assert.deepEqual(parseHousingFloorFromText('2-qavat / 14-qavatli'), { floor: 2, totalFloors: 14 });
            assert.deepEqual(parseHousingFloorFromText('на 5-м этаже, этажность: 9'), { floor: 5, totalFloors: 9 });
            assert.deepEqual(parseHousingFloorFromText('1/0/-1 этаж подвал'), { floor: -1, totalFloors: null });
          });
          EOF
      - name: Validate package
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit package migration
        run: |
          git rm .github/workflows/migrate-housing-text-fields-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/housing-text.js src/housing-text.d.ts test/housing-text-fields-compat.test.js
          git commit -m 'Move remaining housing text field parsers into package'
          git push origin HEAD:feat/housing-text-fields
