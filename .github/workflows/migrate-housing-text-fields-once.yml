name: Migrate remaining housing text fields once

on:
  push:
    branches:
      - feat/housing-text-fields

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/housing-text-fields
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply package migration
        run: python3 .github/scripts/migrate_housing_text_fields.py
      - name: Validate package
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit package migration
        run: |
          git rm .github/workflows/migrate-housing-text-fields-once.yml .github/scripts/migrate_housing_text_fields.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/housing-text.js src/housing-text.d.ts test/housing-text-fields-compat.test.js
          git commit -m 'Move remaining housing text field parsers into package'
          git push origin HEAD:feat/housing-text-fields
