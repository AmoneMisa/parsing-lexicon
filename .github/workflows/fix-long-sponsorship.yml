name: Preserve long sponsorship parsing

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-long-sponsorship.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preserve dotted abbreviations in long sponsorship clauses
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('src/hiring-requirements.js')
          source = source_path.read_text()
          replacements = {
            r"\bmay\s+not\s+be\s+able\s+to\b[^.!?]{0,450}\b(?:sponsor|support|provide)\b[^.!?]{0,180}\bsponsorship\b": r"\bmay\s+not\s+be\s+able\s+to\b[^\n!?]{0,450}\b(?:sponsor|support|provide)\b[^\n!?]{0,180}\bsponsorship\b",
            r"\b(?:will|can|may)\s+not\b[^.!?]{0,220}\b(?:sponsor|support|provide)\b[^.!?]{0,160}\bsponsorship\b": r"\b(?:will|can|may)\s+not\b[^\n!?]{0,220}\b(?:sponsor|support|provide)\b[^\n!?]{0,160}\bsponsorship\b",
            r"\bnot\s+(?:currently\s+)?(?:able\s+to\s+)?(?:sponsor|support|provide)\b[^.!?]{0,160}\bsponsorship\b": r"\bnot\s+(?:currently\s+)?(?:able\s+to\s+)?(?:sponsor|support|provide)\b[^\n!?]{0,160}\bsponsorship\b",
          }
          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f'matcher anchor not found: {old}')
            source = source.replace(old, new, 1)
          source_path.write_text(source)

          test_path = Path('test/hiring-requirements.test.js')
          tests = test_path.read_text()
          marker = "test('handles dotted abbreviations inside long sponsorship clauses'"
          if marker not in tests:
            tests += """

test('handles dotted abbreviations inside long sponsorship clauses', () => {
  const text = 'For US based roles only, the Company may not be able to employ candidates for this role who have United States work authorization related to certain U.S. visa categories, or support future H-1B sponsorship at this time.';
  assert.equal(isNoSponsorshipRequirement(text), true);
});
"""
          test_path.write_text(tests)
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-long-sponsorship.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hiring-requirements.js test/hiring-requirements.test.js .github/workflows/fix-long-sponsorship.yml
          git commit -m "fix: preserve long sponsorship evidence"
          git pull --rebase origin main
          git push origin HEAD:main
