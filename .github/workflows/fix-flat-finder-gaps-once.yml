name: Fix flat-finder shared gaps once
on:
  push:
    branches: [fix/flat-finder-regression-gaps]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: fix/flat-finder-regression-gaps}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm ci
      - name: Apply focused shared fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/housing-listing-fields.js'); s=p.read_text()
          s=s.replace("/кондицион|сплит[- ]?систем|konditsioner|klimat|air\\s*con|aer\\s+condi[țt]ionat/iu", "/кондицион|сплит[- ]?систем|konditsioner|kansaner|kansaner|klimat|air\\s*con|aer\\s+condi[țt]ionat/iu")
          s=s.replace("/новостро|новобуд|новый\\s+дом|new\\s*build|newly\\s*built|yangi\\s+(?:bino|qurilgan|uy)|bloc\\s+nou/iu", "/новостро|новобуд|новый\\s+дом|novast(?:royka|iroyka)|navast(?:royka|iroyka)|new\\s*build|newly\\s*built|yangi\\s+(?:bino|qurilgan|uy)|bloc\\s+nou/iu")
          s=s.replace("|kommunal\\p{L}*\\s*(?:kiritilgan|ichida)|utilities?\\s*included", "|kommunal\\p{L}*\\s*(?:kiritilgan|ichida)|комунал(?:каси)?\\s+ичида|коммунал(?:каси)?\\s+ичида|utilities?\\s*included")
          p.write_text(s)

          p=Path('src/ua-secondary-cities.js'); s=p.read_text()
          old="Izmail: city({ microdistricts: [['Tsentr','Центр'],['Krepost','Крепость'],['Kopana Balka','Копана Балка'],['Broska','Броска']]"
          new="Izmail: city({ microdistricts: [['Tsentr','Центр'],['BAM','БАМ','Бам'],['Krepost','Крепость'],['Kopana Balka','Копана Балка'],['Broska','Броска']]"
          if old not in s: raise SystemExit('Izmail anchor missing')
          p.write_text(s.replace(old,new))

          p=Path('src/tashkent-colloquial.js'); s=p.read_text()
          s=s.replace("'Mirzo Ulugbek': Object.freeze([\n    area('Feruza-1'", "'Mirzo Ulugbek': Object.freeze([\n    area('Alayskiy C-2', ['алайский ц 2', 'алайский ц-2', 'alayskiy c 2', 'alayskiy c-2']),\n    area('Feruza-1'")
          s=s.replace("Shaykhantahur: Object.freeze([\n    area('Gulabad'", "Shaykhantahur: Object.freeze([\n    area('Labzak C-13', ['лабзак ц 13', 'лабзак ц-13', 'labzak c 13', 'labzak c-13']),\n    area('Gulabad'")
          s=s.replace("Yunusabad: Object.freeze([\n    area('Katta Hasanboy'", "Yunusabad: Object.freeze([\n    area('Kashgar C-4', ['кашгар ц 4', 'кашгар ц-4', 'kashgar c 4', 'kashgar c-4']),\n    area('Katta Hasanboy'")
          s=s.replace("Yakkasaray: Object.freeze([\n    area('Bobur'", "Yakkasaray: Object.freeze([\n    area('Glinka', ['глинка', 'glinka']),\n    area('Bobur'")
          s=s.replace("Yashnobod: Object.freeze([\n    area('Asalabad-1'", "Yashnobod: Object.freeze([\n    area('Aviasozlar-3', ['авиасозлар 3', 'авиасозлар-3', 'aviasozlar 3', 'aviasozlar-3']),\n    area('Asalabad-1'")
          if "Yangihayot: Object.freeze([" not in s:
            s=s.replace("Yashnobod: Object.freeze([", "Yangihayot: Object.freeze([\n    area('Yangi Choshtepa', ['янги чоштепа', 'yangi choshtepa']),\n  ]),\n  Yashnobod: Object.freeze([")
          p.write_text(s)

          p=Path('src/housing-address.js'); s=p.read_text()
          anchor="""    const prefix = line.match(new RegExp(`(?:^|[\\\\s,;])(${PREFIX_STREET_MARKER})\\\\s+(.+)$`, 'iu'));"""
          insert="""    const prefixBare = line.match(new RegExp(
      `(?:^|[\\\\s,;])(${PREFIX_STREET_MARKER})\\\\s*((?:${STREET_WORD}\\\\s+){0,3}${STREET_WORD})(?=$|[,;])`,
      'iu',
    ));
    if (prefixBare) return result(clean(prefixBare[0]), prefixBare[2], null, null, 0.9);

    const prefix = line.match(new RegExp(`(?:^|[\\\\s,;])(${PREFIX_STREET_MARKER})\\\\s+(.+)$`, 'iu'));"""
          if anchor not in s: raise SystemExit('address prefix anchor missing')
          s=s.replace(anchor,insert)
          old="""function bareAddress(text) {
  const tail = splitAddressTail(text);
  if (!tail) return null;
  const confidence = tail.houseNumber ? 0.85 : 0.55;"""
          new="""function bareAddress(text) {
  const tail = splitAddressTail(text);
  if (!tail) return null;
  if (/^(?:центр|centre|center)$/iu.test(compactStreet(tail.street) || '')) return null;
  const confidence = tail.houseNumber ? 0.85 : 0.55;"""
          if old not in s: raise SystemExit('bare address anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Shared regression checks
        run: |
          npm test
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {parseHousingListingFields} from './src/housing-listing-fields.js';
          import {parseHousingAddress} from './src/housing-address.js';
          import {UA_SECONDARY_LOCATION_EXTENSIONS} from './src/ua-secondary-cities.js';
          import {FULL_TASHKENT_AREAS} from './src/tashkent-colloquial.js';
          const fields=parseHousingListingFields('kansaner bor Navastiroyka Комуналкаси ичида',{country:'UZ'});
          assert.equal(fields.airConditioner,true); assert.equal(fields.newBuilding,true); assert.equal(fields.communalSeparated,false);
          assert.equal(UA_SECONDARY_LOCATION_EXTENSIONS.Izmail.microdistricts.some(x=>x.name==='BAM'&&x.re.test('район БАМ')),true);
          for (const [district, text] of [['Shaykhantahur','Лабзак Ц-13'],['Yunusabad','Кашгар Ц-4'],['Mirzo Ulugbek','Алайский Ц-2'],['Yashnobod','Авиасозлар-3'],['Yangihayot','Янги Чоштепа'],['Yakkasaray','Глинка']]) assert.equal(FULL_TASHKENT_AREAS[district].some(x=>x.aliases.some(a=>text.toLowerCase().includes(a.toLowerCase()))),true);
          assert.equal(parseHousingAddress('Вул.Чорновола, р-н Руської Поверх — 8/9').address,'Вул.Чорновола');
          assert.equal(parseHousingAddress('центр 1/2',{allowBare:true}).address,null);
          NODE
      - name: Commit
        run: |
          rm .github/workflows/fix-flat-finder-gaps-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: close shared housing and location regressions"
          git push origin HEAD:fix/flat-finder-regression-gaps
