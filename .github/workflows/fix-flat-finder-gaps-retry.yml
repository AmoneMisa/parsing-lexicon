name: Apply shared regression fixes
on:
  push:
    branches:
      - fix/flat-finder-regression-gaps
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/flat-finder-regression-gaps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: node .github/scripts/apply_flat_finder_gap_fixes.mjs
      - run: npm test
      - name: Commit source fixes
        run: |
          rm -f .github/workflows/fix-flat-finder-gaps-once.yml
          rm -f .github/workflows/fix-flat-finder-gaps-retry.yml
          rm -f .github/scripts/apply_flat_finder_gap_fixes.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: close shared housing and location regressions"
          git push origin HEAD:fix/flat-finder-regression-gaps
