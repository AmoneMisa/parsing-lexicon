name: Fix validator symbol aliases
on:
  push:
    branches:
      - feat/full-multilingual-domain-lexicon
    paths:
      - .github/workflows/fix-validator-symbols.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Allow meaningful symbol aliases
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/normalization.js")
          s = p.read_text()
          old = "      const normalized = normalizeForMatch(alias);\n      if (!normalized) {\n"
          new = "      const normalized = normalizeForMatch(alias) || normalizeUnicode(alias).toLocaleLowerCase().trim();\n      if (!normalized) {\n"
          if old not in s:
              raise SystemExit("validator normalized alias block not found")
          p.write_text(s.replace(old, new, 1))
          Path(".github/workflows/fix-validator-symbols.yml").unlink()
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/normalization.js .github/workflows/fix-validator-symbols.yml
          git commit -m 'fix: validate standalone symbol aliases'
          git push
