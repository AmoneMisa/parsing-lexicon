name: Fix Mirzo alias duplicate
on:
  push:
    branches: [feat/full-multilingual-domain-lexicon]
    paths: [.github/workflows/fix-mirzo-alias.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Remove normalized duplicate
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/geo.js')
          s = p.read_text()
          old = 'uzLatn: ["Mirzo Ulug\'bek", \'Mirzo Ulug‘bek\', \'Mirzo Ulugbek\', "Mirzo Ulug\'bek tumani"]'
          new = 'uzLatn: ["Mirzo Ulug\'bek", \'Mirzo Ulugbek\', "Mirzo Ulug\'bek tumani"]'
          if old not in s:
              raise SystemExit('Mirzo Ulugbek alias block not found')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/fix-mirzo-alias.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/geo.js .github/workflows/fix-mirzo-alias.yml
          git commit -m 'fix: dedupe Mirzo Ulugbek alias'
          git push
