name: Fix Priozersk duplicate
on:
  push:
    branches: [feat/full-multilingual-domain-lexicon]
    paths: [.github/workflows/fix-priozersk-duplicate.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
      - name: Remove normalized duplicate
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/central-asia.js')
          s = p.read_text()
          old = "city('Priozersk', { kk: ['Приозерск'], ru: ['Приозёрск', 'Приозерск'], en: ['Priozersk'] }"
          new = "city('Priozersk', { kk: ['Приозерск'], ru: ['Приозёрск'], en: ['Priozersk'] }"
          if old not in s:
              raise SystemExit('Priozersk duplicate row not found')
          p.write_text(s.replace(old, new))
          Path('.github/workflows/fix-priozersk-duplicate.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .github/workflows/fix-priozersk-duplicate.yml
          git commit -m 'fix: remove Priozersk normalized duplicate'
          git push
