name: Central Asia test diagnostics

on:
  push:
    branches: [ feat/full-multilingual-domain-lexicon ]
    paths:
      - .github/workflows/debug-central-asia.yml

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture tests
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          echo $? > test-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: central-asia-test-output
          path: |
            test-output.txt
            test-exit-code.txt
