name: Refactor lexicon invariants

on:
  push:
    branches:
      - feat/full-multilingual-domain-lexicon
    paths:
      - .github/workflows/refactor-lexicon-invariants.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/full-multilingual-domain-lexicon
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply runtime and geo invariant refactor
        run: python .github/scripts/refactor_lexicon_invariants.py
      - name: Commit phase
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src index.d.ts test/runtime-invariants.test.js
          if git diff --cached --quiet; then
            echo 'No invariant changes to commit'
            exit 0
          fi
          git commit -m 'refactor(lexicon): enforce runtime and geo invariants'
          git push origin HEAD:feat/full-multilingual-domain-lexicon
