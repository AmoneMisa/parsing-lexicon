name: Move remaining housing semantics once

on:
  push:
    branches:
      - feat/housing-legacy-semantics

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/housing-legacy-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extend existing housing modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/housing-intent.js')
          s = p.read_text().rstrip()
          if 'export function classifyHousingDealType' not in s:
              s += "\n\nexport function classifyHousingDealType(value) {\n  return resolveHousingIntent(value)?.dealType || null;\n}\n"
          p.write_text(s + '\n')

          p = Path('src/housing-intent.d.ts')
          s = p.read_text().rstrip()
          if 'classifyHousingDealType' not in s:
              s += "\nexport declare function classifyHousingDealType(value: unknown): 'sale' | 'longRent' | 'shortRent' | null;\n"
          p.write_text(s + '\n')

          p = Path('src/housing.js')
          s = p.read_text()
          if "from './normalization.js'" not in s:
              s = s.replace("import { lexiconEntity } from './lexicon-core.js';\n", "import { lexiconEntity } from './lexicon-core.js';\nimport { findCanonical } from './normalization.js';\n", 1)
          s = s.replace("uzLatn: ['uy', 'hovli', 'xovli'], uzCyrl: ['уй', 'ҳовли', 'ховли']", "uzLatn: ['hovli', 'xovli'], uzCyrl: ['ҳовли', 'ховли']")
          if 'export function resolveHousingOccupancy' not in s:
              s = s.rstrip() + r'''

export function resolveHousingOccupancy(value) {
  const match = findCanonical(value, HOUSING_OCCUPANCY_TYPES, { partial: true });
  return match?.canonical || null;
}

export function looksHousingRoomOnly(value) {
  const text = String(value || '');
  if (!text) return false;
  const occupancy = resolveHousingOccupancy(text);
  if (occupancy === 'room' || occupancy === 'sharedRoom' || occupancy === 'bedSpace') return true;
  return /подселени|підселен|комнату\s+в|кімнату\s+в|сда[её]тся\s+комната|сдается\s+комната|сдам\s+комнату|здам\s+кімнат|room\s+in\s+a\s+(?:shared\s+)?flat|room\s+for\s+rent|shared\s+(?:flat|apartment|room)|roommate|flatmate|xona\s+ijaraga|xona\s+beriladi|sherik(?:ka|lik)|шерик(?:ка|лик)|(?:1|бир)\s*та\s*(?:бола|киши|қиз|киз)\s*керак|1\s*хонага[^\r\n]{0,40}(?:киши|одам)\s*турилади|бөлме\s+жалға|închiriez\s+camer[ăa]|ищу[^\r\n]{0,60}сосед|ищем[^\r\n]{0,60}сосед|нужен[^\r\n]{0,60}сосед|нужна[^\r\n]{0,60}сосед|шукаю[^\r\n]{0,60}сусід|шукаємо[^\r\n]{0,60}сусід|потрібен[^\r\n]{0,60}сусід|потрібна[^\r\n]{0,60}сусід|співмешкан|співжител|соседк|сусідк/iu.test(text);
}

export function resolveHousingPropertyType(value) {
  const text = String(value || '');
  if (!text) return null;
  const flat = PROPERTY_TYPES.find((entry) => entry.canonical === 'flat');
  if (flat && findCanonical(text, [flat], { partial: true })) return 'flat';
  return findCanonical(text, PROPERTY_TYPES, { partial: true })?.canonical || null;
}
''' + '\n'
          p.write_text(s)

          p = Path('src/housing-text.js')
          s = p.read_text().rstrip()
          if 'export function parseHousingAudience' not in s:
              s += r'''

export function parseHousingAudience(value) {
  const text = String(value || '');
  if (!text) return null;
  const t = text.toLowerCase();
  if (/(?:семейн|сімейн|для семь|для сім)[^.\n]{0,80}(?:одиноч|мужчин|женщин|чоловік|жінок)|(?:одиноч|мужчин|женщин|чоловік|жінок)[^.\n]{0,80}(?:семейн|сімейн|для семь|для сім)/u.test(t)) return null;
  if (/(для семь|семейн|сімейн|для сім|для родин|for famil|families?|pentru famil|oila(?:ga| uchun|\s+qo['’`]?yiladi|\s+quyiladi)|оила|отбасы)/u.test(t)) return 'family';
  if (/(девуш|девоч|для дівч|дівчат|for girls|for women|only girls|doar fete|\bfete\b|qiz(?:lar|la)?(?:ga| uchun)?|(?:қ|к)из(?:лар|ла)?|қыздар)/u.test(t)) return 'women';
  if (/(парн(ей|ям)|для мужчин|мужчинам|для хлопц|for men\b|for boys|doar b[aă]ie[țt]i|yigit(lar)?(ga| uchun)?|(?:ў|у)гил\s*бол|жігіт|ер адам)/u.test(t)) return 'men';
  return null;
}

export function parseHousingAmenities(value) {
  const text = String(value || '');
  if (!text) return Object.freeze([]);
  const amenities = [];
  if (/(?:посудомо|посудомийн|dishwasher|idish\s*yuvish|idishyuvg|ma[șs]ina de sp[ăa]lat vase)/iu.test(text)) amenities.push('dishwasher');
  if (/(?:комнат\p{L}*\s+раздельн|изолированн\p{L}*\s+комнат|separate\s+rooms?)/iu.test(text)) amenities.push('separateRooms');
  if (/(?:стиральн\p{L}*\s+машин|washing\s+machine|kir\s*yuvish\s*mashin|kirmoshina)/iu.test(text)) amenities.push('washingMachine');
  if (/(?:телевизор|телевизион|televizor|television|\btv\b)/iu.test(text)) amenities.push('television');
  if (/(?:постельн\p{L}*\s+бель|bed\s*linen|toza\s+choyshab|yostiq\s+jild)/iu.test(text)) amenities.push('bedLinen');
  if (/(?:полотенц|towels?|sochiq)/iu.test(text)) amenities.push('towels');
  return Object.freeze(amenities);
}
''' + '\n'
          p.write_text(s)

          p = Path('src/housing-text.d.ts')
          s = p.read_text().rstrip()
          if 'parseHousingAudience' not in s:
              s += "\nexport declare function parseHousingAudience(value: unknown): 'family' | 'women' | 'men' | null;\nexport declare function parseHousingAmenities(value: unknown): readonly ('dishwasher' | 'separateRooms' | 'washingMachine' | 'television' | 'bedLinen' | 'towels')[];\n"
          p.write_text(s + '\n')

          p = Path('src/contact.js')
          s = p.read_text().rstrip()
          if 'export function parsePrimaryContact' not in s:
              s += r'''

export function parsePrimaryContact(value) {
  const text = String(value || '');
  if (!text) return null;

  const intl = text.match(/\+\d[\d\s().-]{7,}\d/);
  if (intl) {
    const digits = intl[0].replace(/\D/g, '');
    if (digits.length >= 10 && digits.length <= 15) return `+${digits}`;
  }

  const keyword = text.match(/(?:tel|тел|phone|моб|whats?app|viber|telegram|звонит|звоніть|aloqa|byla|contact)[^\d+]{0,8}(\+?\d[\d\s().-]{6,}\d)/iu);
  if (keyword) {
    const digits = keyword[1].replace(/\D/g, '');
    if (digits.length >= 9 && digits.length <= 15) return keyword[1].trim();
  }

  const trailing = text.match(/(\+?\d[\d\s().-]{6,}\d)\s*(?:tel|тел(?:ефон)?|phone|моб|whats?app|viber|telegram|aloqa|contact)(?=$|[^\p{L}\p{N}_])/iu);
  if (trailing) {
    const digits = trailing[1].replace(/\D/g, '');
    if (digits.length >= 9 && digits.length <= 15) return trailing[1].trim();
  }

  return findTelegramContacts(text)[0]?.handle || null;
}
''' + '\n'
          p.write_text(s)

          p = Path('src/contact.d.ts')
          s = p.read_text().rstrip()
          if 'parsePrimaryContact' not in s:
              s += "\nexport declare function parsePrimaryContact(value: unknown): string | null;\n"
          p.write_text(s + '\n')

          p = Path('src/housing-structured.js')
          s = p.read_text()
          old = "  const commissionPercent = toNumber(text.match(/(?:комисси\\p{L}*|commission|comision|komissiya)[^\\d%]{0,16}(\\d{1,3}(?:[.,]\\d+)?)\\s*%/iu)?.[1]);\n  const commissionMentioned = SELLER_TERMS.commission && findCanonical(text, [SELLER_TERMS.commission], { partial: true });"
          new = "  const shorthandCommission = text.match(/(?:^|[^\\p{L}\\p{N}_])[mм]\\s*[:.\\-]?\\s*(\\d{1,3})\\s*%/iu);\n  const commissionPercent = toNumber(shorthandCommission?.[1] ?? text.match(/(?:комисси\\p{L}*|commission|comision|komissiya|маклер|makler|rieltor|vositachi)[^\\d%]{0,16}(\\d{1,3}(?:[.,]\\d+)?)\\s*%/iu)?.[1]);\n  const commissionMentioned = Boolean(shorthandCommission) || (SELLER_TERMS.commission && findCanonical(text, [SELLER_TERMS.commission], { partial: true }));"
          if old in s:
              s = s.replace(old, new, 1)
          old2 = "  const agency = SELLER_TERMS.agency && findCanonical(text, [SELLER_TERMS.agency], { partial: true });"
          new2 = "  const agency = (SELLER_TERMS.agency && findCanonical(text, [SELLER_TERMS.agency], { partial: true })) || /(?:^|[^\\p{L}\\p{N}_])[mм]\\s*\\d{1,3}\\s*%/iu.test(text);"
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s)

          p = Path('package.json')
          s = p.read_text().replace('"version": "0.2.4"', '"version": "0.2.5"')
          p.write_text(s)

          p = Path('index.d.ts')
          s = p.read_text().rstrip()
          marker = '// housing semantic helper declarations added in 0.2.5'
          if marker not in s:
              s += "\n\n" + marker + "\nexport function resolveHousingOccupancy(value: unknown): 'wholeProperty' | 'room' | 'sharedRoom' | 'bedSpace' | null;\nexport function looksHousingRoomOnly(value: unknown): boolean;\nexport function resolveHousingPropertyType(value: unknown): 'flat' | 'house' | 'room' | 'studio' | 'townhouse' | 'dormitory' | null;\n"
          p.write_text(s + '\n')
          PY
      - name: Add regression coverage
        run: |
          cat > test/housing-legacy-semantics.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import { classifyHousingDealType } from '../src/housing-intent.js';
          import { looksHousingRoomOnly, resolveHousingPropertyType } from '../src/housing.js';
          import { parseHousingAudience, parseHousingAmenities } from '../src/housing-text.js';
          import { parsePrimaryContact } from '../src/contact.js';
          import { parseHousingPayments, parseHousingSeller } from '../src/housing-structured.js';

          test('deal type stays multilingual', () => {
            assert.equal(classifyHousingDealType('Продаю квартиру'), 'sale');
            assert.equal(classifyHousingDealType('Квартира посуточно'), 'shortRent');
            assert.equal(classifyHousingDealType('Уй ижарага берилади'), 'longRent');
            assert.equal(classifyHousingDealType('Пәтер жалға беріледі'), 'longRent');
          });

          test('room-only and property semantics stay shared', () => {
            assert.equal(looksHousingRoomOnly('Ищу соседку в комнату'), true);
            assert.equal(looksHousingRoomOnly('Квартира с двумя комнатами'), false);
            assert.equal(resolveHousingPropertyType('Квартира в новом доме'), 'flat');
            assert.equal(resolveHousingPropertyType('hovli sotiladi'), 'house');
            assert.notEqual(resolveHousingPropertyType('uy yangi remontdan chiqqan'), 'house');
          });

          test('audience, amenities and contacts preserve consumer behavior', () => {
            assert.equal(parseHousingAudience('Квартира только для семьи'), 'family');
            assert.equal(parseHousingAudience('Только для девушек'), 'women');
            assert.deepEqual(parseHousingAmenities('Есть посудомоечная машина, стиральная машина и TV'), ['dishwasher', 'washingMachine', 'television']);
            assert.equal(parsePrimaryContact('Тел: 771443473'), '771443473');
            assert.equal(parsePrimaryContact('Пишите @owner_test'), '@owner_test');
          });

          test('payment and seller semantics cover Telegram broker shorthand', () => {
            assert.deepEqual(parseHousingPayments('M50%').commission, { required: true, percent: 50 });
            assert.equal(parseHousingSeller('M50%').type, 'agency');
            assert.deepEqual(parseHousingPayments('без комиссии').commission, { required: false, percent: null });
          });
          EOF
      - name: Validate package
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
      - name: Commit package migration
        run: |
          git rm .github/workflows/migrate-housing-semantics-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json index.d.ts src/housing-intent.js src/housing-intent.d.ts src/housing.js src/housing-text.js src/housing-text.d.ts src/contact.js src/contact.d.ts src/housing-structured.js test/housing-legacy-semantics.test.js
          git commit -m 'Move remaining generic housing semantics into package'
          git push origin HEAD:feat/housing-legacy-semantics
