name: Centralize contextual skill semantics

on:
  push:
    branches:
      - cleanup/final-hiring-fields
    paths:
      - '.github/workflows/final-contextual-skills.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Add contextual skill matching
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/hiring-skills.js')
          text = path.read_text()
          marker = "const COMPILED_SKILLS = SKILL_CATALOG.map((definition) => ({\n"
          insertion = """const CONTEXTUAL_SKILL_PATTERNS = Object.freeze([
            ['Corporate Governance', /\\b(?:group|company|corporate) governance\\b/i],
            ['Data Analysis', /\\banalys(?:e|is|ing)\\b[^.;\\n]{0,60}\\b(?:data|metrics?|funnels?)\\b|\\b(?:data|metrics?|funnels?)\\b[^.;\\n]{0,60}\\banalys(?:e|is|ing)\\b/i],
            ['Conversion Funnel', /\\b(?:conversion|onboarding|registration)[- ](?:to[- ]\\w+\\s+)?funnel\\b|\\bonboarding funnel\\b/i],
            ['Cross-functional Collaboration', /\\bcross[- ]function(?:al|ally)\\b/i],
          ])

          """
          insertion = '\n'.join(line[10:] if line.startswith('          ') else line for line in insertion.splitlines()) + '\n'
          if text.count(marker) != 1:
              raise SystemExit(f'compiled skill marker count {text.count(marker)}')
          text = text.replace(marker, insertion + marker, 1)

          old = """export function extractSkillDetails(text) {
            const normalized = normalizeSkillText(text)
            const found = []
            for (const { definition, patterns } of COMPILED_SKILLS) {
              if (!patterns.some((pattern) => pattern.test(normalized))) continue
              found.push({
                name: definition.name,
                category: definition.category,
                subcategory: definition.subcategory,
              })
            }
            return found
          }
          """
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = """export function extractSkillDetails(text) {
            const normalized = normalizeSkillText(text)
            const found = []
            const names = new Set()
            for (const { definition, patterns } of COMPILED_SKILLS) {
              if (!patterns.some((pattern) => pattern.test(normalized))) continue
              found.push({
                name: definition.name,
                category: definition.category,
                subcategory: definition.subcategory,
              })
              names.add(definition.name)
            }
            for (const [name, pattern] of CONTEXTUAL_SKILL_PATTERNS) {
              if (names.has(name) || !pattern.test(normalized)) continue
              const meta = SKILL_META[name]
              if (!meta) continue
              found.push({ name, ...meta })
              names.add(name)
            }
            return found
          }
          """
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'extractSkillDetails block count {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          test_path = Path('test/hiring-skills.test.js')
          tests = test_path.read_text()
          addition = """
          test('shared skill matcher handles contextual non-adjacent phrases', () => {
            const names = extractSkillNames('Analyse onboarding funnel data and work cross functionally on company governance.');
            for (const name of ['Data Analysis', 'Conversion Funnel', 'Cross-functional Collaboration', 'Corporate Governance']) {
              assert.ok(names.includes(name), `${name} should be detected`);
            }
          });
          """
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          test_path.write_text(tests.rstrip() + '\n' + addition)
          PY

      - name: Test package
        run: npm test

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-contextual-skills.yml
          git add src/hiring-skills.js test/hiring-skills.test.js
          git commit -m "refactor: centralize contextual skill matching"
          git push
